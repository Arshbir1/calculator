
services:
  calculator:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CALCULATOR_IMAGE:-calculator:local}
    environment:
      SERVER_PORT: 8080
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - calculator-network

  nginx:
    image: nginx:alpine
    ports:
      - "8083:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - calculator-network

networks:
  calculator-network:
    driver: bridge

